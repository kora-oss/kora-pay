apiVersion: apps/v1
kind: Deployment
metadata:
  name: kora-pay-api
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    spec:
      containers:
        - name: api
          image: kora-pay-api:2.0.0
          readinessProbe: { httpGet: { path: /health, port: 3000 } }
